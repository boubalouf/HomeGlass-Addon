[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "homeglass-server"
version = "0.1.0"
description = "HomeGlass Server - éditeur et API de mise en page pour le dashboard Android HomeGlass"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.9,<3",
    "websockets>=13,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
]

[tool.setuptools]
packages = [
    "homeglass_server",
    "homeglass_server.api",
    "homeglass_server.ha",
    "homeglass_server.models",
    "homeglass_server.store",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
